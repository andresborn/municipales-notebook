[project]
name = "municipales-notebook"
version = "0.1.0"
description = "Análisis de las elecciones municipales de Costa Rica de 2024"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "marimo[recommended]>=0.25.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
]

[project.scripts]
municipales-notebook = "municipales_notebook:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
